<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#27272a" stroke-width="4"/>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.12" filter="url(#glow)"/>

  <!-- Stylized Kaizen Continuous Improvement Spiral / Emblem -->
  <!-- Outer Arc (Continuous Growth) -->
  <path d="M 256 96 A 160 160 0 1 1 128 352" fill="none" stroke="url(#emeraldGrad)" stroke-width="28" stroke-linecap="round"/>
  
  <!-- Amber Accent (Ascending Focus Spark) -->
  <path d="M 256 160 A 96 96 0 0 1 352 256" fill="none" stroke="url(#amberGrad)" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Center Core Star / Milestone Peak -->
  <circle cx="256" cy="256" r="32" fill="url(#emeraldGrad)"/>
  <polygon points="256,192 268,228 304,228 274,250 286,286 256,264 226,286 238,250 208,228 244,228" fill="#f4f4f5" opacity="0.95"/>

  <!-- Minimal Kaizen Dot Accent -->
  <circle cx="128" cy="352" r="14" fill="#fbbf24"/>
</svg>
